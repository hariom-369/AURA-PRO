server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively; never cache index.html itself
    # (it must always be revalidated so users get the latest deployed build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unmatched path serves index.html so React Router
    # handles client-side routes (e.g. /products/some-slug on a hard refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
