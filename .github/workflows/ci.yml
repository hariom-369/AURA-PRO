name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (lint-equivalent checks, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          # Deliberately no GEMINI_API_KEY / STRIPE_SECRET_KEY / RESEND_API_KEY /
          # CLOUDINARY_* / GOOGLE_CLIENT_ID / TURNSTILE_SECRET_KEY — the suite
          # exercises each feature's graceful fallback path (and, for Google
          # sign-in, its mocked-SDK tests) when these are unset, by design.
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t aura-pro-server ./server
      - name: Build client image
        run: docker build -t aura-pro-client --build-arg VITE_API_URL=http://localhost:5000/api/v1 ./client
